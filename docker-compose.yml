services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
      POSTGRES_DB: engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://engine:engine@postgres:5432/engine
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 15

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://engine:engine@postgres:5432/engine
      REDIS_URL: redis://redis:6379/0
      WORKER_RUNTIMES: python,node
      POLL_INTERVAL: "5"
    volumes:
      # Gives the worker control of the host Docker daemon (effectively root on
      # the host). Acceptable for local dev; see README "Security model".
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api: { condition: service_healthy }
    deploy:
      replicas: 2
    stop_grace_period: 30s

  # React dashboard served by nginx, which also proxies /api to the API (no CORS).
  dashboard:
    build: frontend
    ports:
      - "3000:80"
    depends_on:
      api: { condition: service_healthy }

  # Recovers jobs from dead or wedged workers. Separate process so it survives
  # worker failures; replicas are safe (row locks), two remove it as a SPOF.
  controller:
    build:
      context: .
      dockerfile: docker/controller.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://engine:engine@postgres:5432/engine
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_healthy }
    deploy:
      replicas: 2

  # Runner images the worker launches per job. Not started by `up`; build them
  # once with:  docker compose --profile runners build
  runner-python:
    profiles: ["runners"]
    build: docker/runner-python
    image: dwee-runner-python:latest
  runner-node:
    profiles: ["runners"]
    build: docker/runner-node
    image: dwee-runner-node:latest

volumes:
  pgdata:
