[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-execution-engine"
version = "0.0.1"
requires-python = ">=3.12"
# shared by API and worker
dependencies = [
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["api*", "shared*", "worker*", "controller*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", "distributed_execution_engine.egg-info"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, S: bandit (security)
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults is the framework's idiom, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# asserts are what tests are made of; the fake docker and fixtures use throwaway paths
"tests/*" = ["S101", "S108", "S105", "S106", "S603", "S607"]
# the smoke test is a test: asserts are its job; the URL is the operator's own --base-url
# and docker is invoked with a fixed argv, no shell
"scripts/smoke_test.py" = ["S101", "S310", "S603"]
# parses the JUnit file pytest just wrote in the same job, not untrusted input
".github/scripts/*" = ["S314"]
