name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch/PR makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, then the whole backend suite against REAL Postgres and Redis.
  # The Docker isolation tests run in their own job below.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine
          POSTGRES_DB: engine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engine"
          --health-interval 3s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://engine:engine@localhost:5432/engine_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -rs --ignore=tests/test_docker_integration.py --junitxml=reports/backend.xml
      # Postgres/Redis tests skip themselves when the service is unreachable. A skip here
      # means a service did not come up, so the job must not go green.
      - name: Fail on skipped tests
        run: python .github/scripts/assert_no_skips.py reports/backend.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The tests that prove the isolation claims (non-root, read-only rootfs, no network,
  # memory/timeout kills, fork bomb, no leftover containers) against a real daemon.
  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Build runner images
        run: sh docker/build-runners.sh
      - name: Isolation tests
        run: pytest tests/test_docker_integration.py -v -rs --junitxml=reports/docker.xml
      - name: Fail on skipped tests
        run: python .github/scripts/assert_no_skips.py reports/docker.xml

  # Builds every image and runs the real compose stack: API, 2 workers, 2 controllers,
  # dashboard. Then submits jobs, kills a busy worker and checks the job still finishes.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build runner images
        run: docker compose --profile runners build
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (success, failure, timeout, worker loss)
        run: python3 scripts/smoke_test.py --kill-worker
      - name: Dashboard serves and proxies to the API
        run: |
          curl -fsS http://localhost:3000/ | grep -q 'id="root"'
          curl -fsS http://localhost:3000/api/ready
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Live API contract test
        working-directory: frontend
        run: |
          npm ci
          CONTRACT_BASE_URL=http://localhost:8000 npm run contract
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
